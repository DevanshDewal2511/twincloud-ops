services:

  aws-primary:
    image: nginx:alpine
    container_name: twincloud-aws-primary
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./simulation/aws:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health.json || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - twincloud-net

  azure-secondary:
    image: nginx:alpine
    container_name: twincloud-azure-secondary
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./simulation/azure:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health.json || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - twincloud-net

  proxy:
    image: nginx:alpine
    container_name: twincloud-proxy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - aws-primary
      - azure-secondary
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/proxy-status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - twincloud-net

  db:
    image: postgres:16-alpine
    container_name: twincloud-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: twincloud
    # Internal to twincloud-net: database port is strictly isolated from public host interfaces
    volumes:
      - twincloud_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twincloud"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - twincloud-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twincloud-backend
    # Bound to local loopback only; all external/public traffic must route through Nginx
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/twincloud
      - DEMO_CONTROL_KEY=${DEMO_CONTROL_KEY:-twincloud-demo-2026}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      aws-primary:
        condition: service_started
      azure-secondary:
        condition: service_started
      proxy:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - twincloud-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twincloud-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - twincloud-net

networks:
  twincloud-net:
    driver: bridge

volumes:
  twincloud_pgdata:
