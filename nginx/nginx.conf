events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream cloud_backend {
        # Primary environment: AWS
        server aws-primary:80 max_fails=2 fail_timeout=5s;
        
        # Disaster Recovery secondary environment: Azure (Standby)
        server azure-secondary:80 backup;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Proxy health and routing metadata endpoint
        location /proxy-status {
            default_type application/json;
            return 200 '{"service":"twincloud-proxy","status":"UP","primary_target":"aws-primary:8081","dr_backup_target":"azure-secondary:8082"}\n';
        }

        # Main traffic ingress
        location / {
            proxy_pass http://cloud_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Aggressive timeouts to trigger rapid failover
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # Failover triggers for disaster recovery simulation
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Diagnostic headers
            add_header X-Proxied-By "TwinCloud-Ops-Proxy" always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }
}
