name: TwinCloud Ops CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Compile Production Bundle
        working-directory: frontend
        run: npm run build

  docker-e2e-chaos-drill:
    name: End-to-End Multi-Cloud DR Simulation Drill
    needs: [backend-unit-tests, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Launch Full 6-Container Fleet
        run: |
          docker compose up -d --build

      - name: Wait for Fleet Health Checks
        run: |
          echo "Waiting for all 6 containers to report healthy..."
          sleep 15
          docker ps

      - name: Execute Automated Multi-Cloud Chaos Drill Suite
        run: |
          python monitoring/chaos_runner.py

      - name: Teardown Fleet
        if: always()
        run: |
          docker compose down -v
